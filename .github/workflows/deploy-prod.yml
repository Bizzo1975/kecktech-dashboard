name: Deploy to Production (Blocked Pending Reconciliation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-blocked:
    name: Deployment safety gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject deployment until the reviewed pipeline exists
        shell: pwsh
        run: ./tools/deployment/assert-deployment-authorized.ps1 -Environment production
