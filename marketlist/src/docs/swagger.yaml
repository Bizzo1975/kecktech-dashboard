openapi: 3.0.0
info:
  title: Grocery App API
  version: 1.0.0
  description: API documentation for the Grocery App

servers:
  - url: /api/v1
    description: API v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GroceryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        category:
          type: string
          enum:
            - Fruits & Vegetables
            - Meat & Seafood
            - Dairy & Eggs
            - Bakery
            - Frozen Foods
            - Pantry
            - Snacks
            - Beverages
            - Household
            - Personal Care
        unit:
          type: string
          enum:
            - piece
            - kg
            - g
            - lb
            - oz
            - l
            - ml
            - cup
            - tbsp
            - tsp
            - box
            - pack
            - bundle
        barcode:
          type: string
          maxLength: 50
        imageUrl:
          type: string
          format: uri
        nutritionalInfo:
          type: object
          properties:
            calories:
              type: number
              minimum: 0
            protein:
              type: number
              minimum: 0
            carbs:
              type: number
              minimum: 0
            fat:
              type: number
              minimum: 0

    GroceryList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        isShared:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListItem'

    ListItem:
      type: object
      properties:
        groceryItemId:
          type: string
          format: uuid
        quantity:
          type: number
          minimum: 0.01
          maximum: 9999
        unit:
          type: string
          enum:
            - piece
            - kg
            - g
            - lb
            - oz
            - l
            - ml
            - cup
            - tbsp
            - tsp
            - box
            - pack
            - bundle
        notes:
          type: string
          maxLength: 200

    PantryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groceryItemId:
          type: string
          format: uuid
        quantity:
          type: number
          minimum: 0.01
          maximum: 9999
        unit:
          type: string
          enum:
            - piece
            - kg
            - g
            - lb
            - oz
            - l
            - ml
            - cup
            - tbsp
            - tsp
            - box
            - pack
            - bundle
        minimumQuantity:
          type: number
          minimum: 0
        expirationDate:
          type: string
          format: date-time
        purchaseDate:
          type: string
          format: date-time
        purchasePrice:
          type: number
          minimum: 0
          maximum: 999999.99
        store:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 500

paths:
  /grocery/items:
    get:
      summary: Get all grocery items
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: List of grocery items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroceryItem'
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer

    post:
      summary: Create a new grocery item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroceryItem'
      responses:
        '201':
          description: Grocery item created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/GroceryItem'

  /grocery/lists:
    get:
      summary: Get all grocery lists
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of grocery lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroceryList'

    post:
      summary: Create a new grocery list
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroceryList'
      responses:
        '201':
          description: Grocery list created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    $ref: '#/components/schemas/GroceryList'

  /pantry/items:
    get:
      summary: Get all pantry items
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: List of pantry items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PantryItem'
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer

    post:
      summary: Create a new pantry item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryItem'
      responses:
        '201':
          description: Pantry item created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/PantryItem'

  /pantry/analytics:
    get:
      summary: Get pantry analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pantry analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalItems:
                    type: integer
                  lowStockCount:
                    type: integer
                  categoryDistribution:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                        count:
                          type: integer
                  recentlyUpdated:
                    type: array
                    items:
                      $ref: '#/components/schemas/PantryItem' 