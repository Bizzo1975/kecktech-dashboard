# Uncle Jon marketing — Traefik hits host:3006; CtrlPanel keeps host :80/:443
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - HOST=0.0.0.0
      - PORT=3000
    # Prefer node directly so a CRLF entrypoint cannot crash-loop the stack.
    entrypoint: ["node", "server.js"]
    ports:
      - "3006:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uj-net
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file:
      - .env.production
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - uj_postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - uj-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    env_file:
      - .env.production
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - uj_redis_data:/data
    networks:
      - uj-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  uj_postgres_data:
  uj_redis_data:

networks:
  uj-net:
    driver: bridge
